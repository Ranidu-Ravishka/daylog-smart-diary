name: Validate Prod Env

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  validate-env:
    name: Validate production environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Run env validator
        env:
          # Pass production secrets only for main branch (push). For PRs these will be empty.
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXPORT_SIGNING_SECRET: ${{ secrets.EXPORT_SIGNING_SECRET }}
          INTEGRATION_SECRETS_KEYRING_JSON: ${{ secrets.INTEGRATION_SECRETS_KEYRING_JSON }}
          INTEGRATION_SECRETS_ACTIVE_KEY_ID: ${{ secrets.INTEGRATION_SECRETS_ACTIVE_KEY_ID }}
          CI: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          MODE=local
          if [ "${CI}" = "true" ]; then MODE=ci; fi
          echo "Running env validator in mode=${MODE}"
          node scripts/validate-prod-env.mjs --mode=${MODE}
