name: Example Deploy (uses pre-deploy validator)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string
        default: staging

jobs:
  pre-deploy-check:
    name: Pre-deploy validation
    uses: ./.github/workflows/pre-deploy-validate.yml
    with:
      mode: ci
    secrets:
      # forward required repo secrets to the reusable workflow
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXPORT_SIGNING_SECRET: ${{ secrets.EXPORT_SIGNING_SECRET }}
      INTEGRATION_SECRETS_KEYRING_JSON: ${{ secrets.INTEGRATION_SECRETS_KEYRING_JSON }}
      INTEGRATION_SECRETS_ACTIVE_KEY_ID: ${{ secrets.INTEGRATION_SECRETS_ACTIVE_KEY_ID }}

  deploy:
    name: Deploy (example)
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Placeholder deploy step
        run: |
          echo "Pre-deploy validation passed; proceed to deploy to '${{ github.event.inputs.environment }}'"
