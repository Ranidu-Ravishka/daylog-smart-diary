name: Pre-deploy Validate (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "Validation mode ('ci' or 'local'). Defaults to 'ci'."
        required: false
        type: string
    secrets:
      CLERK_JWT_ISSUER_DOMAIN:
        required: false
      CLERK_WEBHOOK_SECRET:
        required: false
      OPENAI_API_KEY:
        required: false
      EXPORT_SIGNING_SECRET:
        required: false
      INTEGRATION_SECRETS_KEYRING_JSON:
        required: false
      INTEGRATION_SECRETS_ACTIVE_KEY_ID:
        required: false

jobs:
  validate:
    name: Validate production environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run env validator
        env:
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXPORT_SIGNING_SECRET: ${{ secrets.EXPORT_SIGNING_SECRET }}
          INTEGRATION_SECRETS_KEYRING_JSON: ${{ secrets.INTEGRATION_SECRETS_KEYRING_JSON }}
          INTEGRATION_SECRETS_ACTIVE_KEY_ID: ${{ secrets.INTEGRATION_SECRETS_ACTIVE_KEY_ID }}
        run: |
          MODE=${{ inputs.mode || 'ci' }}
          echo "Running pre-deploy env validator in mode=${MODE}"
          node scripts/validate-prod-env.mjs --mode=${MODE}
