name: backend-validation

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  branch-protection-verification:
    name: branch-protection-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify branch protection policy (fail-closed)
        # This step validates live GitHub branch protection via API.
        # Any verification error must fail this workflow.
        # For private GitHub Free repos, GitHub may block the branch-protection API.
        # In that specific case, we allow an explicit bypass with a warning.
        # Optional secrets.BRANCH_PROTECTION_TOKEN: PAT with repo (classic) or Administration:read
        # (fine-grained). If unset or empty, github.token is used; it often cannot read branch
        # protection (403 integration), which the verifier can bypass when the env flag below is set.
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOW_UNSUPPORTED_BRANCH_PROTECTION: "true"
        run: pnpm verify:branch-protection -- --branch main

  backend-validation:
    name: backend-validation
    # Block build/lint/typecheck until branch protection verification passes.
    needs:
      - branch-protection-verification
    runs-on: ubuntu-latest
    env:
      # Dummy Convex URL so ConvexReactClient doesn't fail during Next.js build in CI
      NEXT_PUBLIC_CONVEX_URL: "https://dummy.convex.invalid"
      EXPO_PUBLIC_CONVEX_URL: "https://dummy.convex.invalid"
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_dummy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Required for correct diffing
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production environment gate (fail-closed)
        env:
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXPORT_SIGNING_SECRET: ${{ secrets.EXPORT_SIGNING_SECRET }}
          INTEGRATION_SECRETS_KMS_KEY_ID: ${{ secrets.INTEGRATION_SECRETS_KMS_KEY_ID }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          KEY_RING_URI: ${{ secrets.KEY_RING_URI }}
          INTEGRATION_SECRETS_KEYRING_JSON: ${{ secrets.INTEGRATION_SECRETS_KEYRING_JSON }}
          INTEGRATION_SECRETS_ACTIVE_KEY_ID: ${{ secrets.INTEGRATION_SECRETS_ACTIVE_KEY_ID }}
        run: |
          MODE=local
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then MODE=ci; fi
          node scripts/validate-prod-env.mjs --mode=${MODE}

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'

            admin:
              - 'apps/admin/**'

            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

      - name: Compute build flags
        id: set
        shell: bash
        env:
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
        run: |
          bool_or() {
            for v in "$@"; do
              if [ "$v" = "true" ]; then
                echo "true"
                return 0
              fi
            done
            echo "false"
          }

          WEB="$(bool_or "$WEB_CHANGED" "$SHARED_CHANGED")"
          ADMIN="$(bool_or "$ADMIN_CHANGED" "$SHARED_CHANGED")"

          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Secret scan (high-confidence)
        shell: bash
        run: |
          set -euo pipefail

          SECRET_PATTERN='(sk_(test|live)_[A-Za-z0-9]{20,}|pk_(test|live)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{16,})'

          if git grep -nE "$SECRET_PATTERN" -- . ':(exclude)SECURITY.md'; then
            echo "Potential secret detected. Remove it and rotate keys if needed."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Guardrail check (dashboard scans)
        shell: bash
        run: |
          set -euo pipefail

          if grep -n 'collect(' \
            apps/admin/app/admin/dashboard/page.tsx \
            apps/admin/app/integrations/health/page.tsx \
            packages/backend/convex/integrationHealth.ts; then
            echo "Disallowed collect() usage detected in admin dashboard/health query paths."
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Guard baseline-browser-mapping freshness
        run: pnpm check:baseline-browser-mapping

      - name: Build web app
        if: steps.set.outputs.web == 'true'
        run: pnpm run build:web

      - name: Build admin app
        if: steps.set.outputs.admin == 'true'
        run: pnpm run build:admin

      - name: Mobile build validation (Expo web export)
        run: pnpm --filter mobile build:ci

      - name: Check mobile web bundle budgets
        run: pnpm check:bundle-budgets

      - name: Ensure web build for Playwright E2E
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/web/.next/BUILD_ID ]; then
            echo "No apps/web/.next/BUILD_ID — building web for E2E…"
            pnpm run build:web
          else
            echo "Reusing existing web .next from earlier step."
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (Chromium)
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Web Playwright E2E (OAuth proxy)
        run: pnpm --filter web test:e2e
        env:
          PLAYWRIGHT_WEB_PORT: "3010"
          CI: "true"

  app-test-matrix:
    name: app-tests-${{ matrix.app }}
    # Block test matrix until branch protection verification passes.
    needs:
      - branch-protection-verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - web
          - backend
          - admin
          - mobile
    env:
      NEXT_PUBLIC_CONVEX_URL: "https://dummy.convex.invalid"
      EXPO_PUBLIC_CONVEX_URL: "https://dummy.convex.invalid"
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_dummy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run matrix test target
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.app }}" in
            web)
              pnpm --filter web test
              ;;
            backend)
              pnpm test:coverage:backend
              ;;
            admin)
              pnpm --filter admin test
              ;;
            mobile)
              pnpm --filter mobile test
              ;;
            *)
              echo "Unsupported app target: ${{ matrix.app }}"
              exit 1
              ;;
          esac
