name: Feature Branch CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================
  # Detect changed areas
  # ==================================================
  changes:
    runs-on: ubuntu-latest

    outputs:
      web: ${{ steps.set.outputs.web }}
      admin: ${{ steps.set.outputs.admin }}
      mobile: ${{ steps.set.outputs.mobile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for correct diffing
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'

            admin:
              - 'apps/admin/**'

            mobile:
              - 'apps/mobile/**'

            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

      - name: Compute build flags
        id: set
        shell: bash
        env:
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          MOBILE_CHANGED: ${{ steps.filter.outputs.mobile }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}

        run: |
          bool_or() {
            for v in "$@"; do
              if [ "$v" = "true" ]; then
                echo "true"
                return 0
              fi
            done
            echo "false"
          }

          WEB="$(bool_or "$WEB_CHANGED" "$SHARED_CHANGED")"
          ADMIN="$(bool_or "$ADMIN_CHANGED" "$SHARED_CHANGED")"
          MOBILE="$(bool_or "$MOBILE_CHANGED" "$SHARED_CHANGED")"

          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"
          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"

  # ==================================================
  # Main CI checks
  # ==================================================
  ci-checks:
    runs-on: ubuntu-latest
    needs: [changes]

    env:
      # Dummy Convex URL so ConvexReactClient doesn't fail during Next.js build in CI
      NEXT_PUBLIC_CONVEX_URL: "https://dummy.convex.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build web app
        if: needs.changes.outputs.web == 'true'
        run: pnpm run build:web

      - name: Build admin app
        if: needs.changes.outputs.admin == 'true'
        run: pnpm run build:admin
